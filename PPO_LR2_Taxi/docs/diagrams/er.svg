<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="title desc"><title id="title">ER-диаграмма Чена — финансовые планы службы такси</title><desc id="desc">Финансовый план с ключом Id идентифицирует слабую сущность Месяц плана через связь Содержит. Number — частичный ключ месяца, уникальный внутри плана. План содержит ровно три месяца. Полный ключ месяца: PlanId и Number.</desc><rect width="1900" height="1120" fill="white"/><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#222}.title{font-size:36px;font-weight:700}.entity{font-size:28px;font-weight:700}.attr{font-size:25px}.label{font-size:23px}.legend{font-size:21px}</style>
