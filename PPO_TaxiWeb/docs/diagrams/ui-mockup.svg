<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><style>text{font-family:DejaVu Sans,sans-serif;fill:#17263b} .h{font-size:28px;font-weight:bold}.s{font-size:18px}.m{font-size:15px;fill:#5a687b}</style><rect width="1440" height="1000" fill="#f4f5f7"/><text x="50" y="52" class="h">Служба такси — проектный макет</text><text x="50" y="82" class="m">Это макет экранов клиента и диспетчера, не снимок приложения.</text><rect x="30" y="110" width="1380" height="400" rx="16" fill="white"/><text x="55" y="150" class="h">Клиент / Новая поездка</text><g fill="#eef2f6" stroke="#c2cbd7"><rect x="55" y="180" width="300" height="50" rx="6"/><rect x="375" y="180" width="300" height="50" rx="6"/><rect x="695" y="180" width="300" height="50" rx="6"/><rect x="1015" y="180" width="335" height="50" rx="6"/></g><text x="70" y="212" class="s">ФИО и телефон</text><text x="390" y="212" class="s">Адрес подачи</text><text x="710" y="212" class="s">Адрес назначения</text><text x="1030" y="212" class="s">Расстояние: 4 км</text><rect x="55" y="250" width="250" height="48" rx="7" fill="#f3c443"/><text x="70" y="282" class="s">Сравнить тарифы</text><text x="55" y="335" class="s">Тариф                       Базовая цена          За расстояние           Итого</text><text x="55" y="375" class="s">Эконом                      100.00 ₽                 80.00 ₽                   180.00 ₽</text><text x="55" y="410" class="s">Комфорт                    150.00 ₽                120.00 ₽                  270.00 ₽</text><text x="55" y="445" class="s">Бизнес                       250.00 ₽                200.00 ₽                  450.00 ₽</text><rect x="1070" y="430" width="280" height="48" rx="7" fill="#f3c443"/><text x="1090" y="462" class="s">Создать заказ</text><rect x="30" y="540" width="1380" height="410" rx="16" fill="white"/><text x="55" y="585" class="h">Диспетчер / Заказы</text><text x="55" y="630" class="s">Свободный водитель: Пётр Водитель — Kia Rio</text><rect x="55" y="660" width="1295" height="48" fill="#edf2f8"/><text x="70" y="692" class="s">Номер        Маршрут                                  Цена         Статус                       Действие</text><text x="70" y="750" class="s">a1b2c3d4    Вокзал → Университет              270.00 ₽    Создан</text><rect x="1060" y="720" width="270" height="48" rx="7" fill="#f3c443"/><text x="1080" y="752" class="s">Назначить</text><text x="55" y="820" class="m">Водитель видит только свои активные заказы и кнопки «Начать» / «Завершить».</text><text x="55" y="855" class="m">Ошибки показываются у рабочей области; старые оценки скрываются после изменения ввода.</text><text x="55" y="900" class="m">Вход по роли выполняется сервером. Обновление данных — по кнопке.</text></svg>
